# Private graders for the agent-suitability suite (`vgi-lint simulate` / `--ai`).
#
# The prompts are published in the catalog vgi.agent_test_tasks tag
# (crates/asn1-worker/src/main.rs); the answers live here, keyed by task name,
# so the agent being graded never sees them (VGI416). vgi-lint discovers this
# file in the directory it runs from. Every reference_sql was verified against
# the live worker so exact-compare grading is sound; success_criteria is the
# LLM-judge fallback rubric.

tasks:
  - name: "resolve_oid_name"
    reference_sql: "SELECT asn1.main.oid_name('1.2.840.113549.1.1.11') AS name"
    success_criteria: "The answer is the algorithm name 'sha256WithRSAEncryption'."
  - name: "name_to_oid"
    reference_sql: "SELECT asn1.main.oid('sha256WithRSAEncryption') AS oid"
    success_criteria: "The answer is the dotted OID '1.2.840.113549.1.1.11'."
  - name: "decode_small_der"
    reference_sql: "SELECT asn1.main.decode(from_hex('3003020105')) AS j"
    success_criteria: "The blob is SEQUENCE { INTEGER 5 }; the decoded JSON is the array [5]."
  - name: "to_json_shape"
    reference_sql: "SELECT contains(asn1.main.to_json(from_hex('301202010506092a864886f70d01010b0c026869')), 'SEQUENCE') AS ok"
    success_criteria: "The outermost node is a SEQUENCE, so the answer is true."
  - name: "dump_has_oid"
    reference_sql: "SELECT contains(asn1.main.dump(from_hex('301202010506092a864886f70d01010b0c026869')), 'OBJECT IDENTIFIER') AS ok"
    success_criteria: "The blob contains an OBJECT IDENTIFIER, so the dump includes one and the answer is true."
  - name: "tlv_node_count"
    reference_sql: "SELECT len(asn1.main.tlv(from_hex('301202010506092a864886f70d01010b0c026869'))) AS n"
    success_criteria: "The blob is a SEQUENCE with three children, so there are 4 TLV nodes."
  - name: "oid_inventory_count"
    reference_sql: "SELECT len(asn1.main.oids(from_hex('301202010506092a864886f70d01010b0c026869'))) AS n"
    success_criteria: "The blob carries exactly one OID, so the answer is 1."
  - name: "value_at_path"
    reference_sql: "SELECT asn1.main.at_path(from_hex('3003020105'), '$.0') AS v"
    success_criteria: "The first child is INTEGER 5, so the value is 5."
  - name: "validity_well_formed"
    reference_sql: "SELECT (asn1.main.well_formed(from_hex('300502'))).ok AS ok"
    success_criteria: "The blob is truncated/malformed, so ok is false."
  - name: "is_valid_der"
    reference_sql: "SELECT asn1.main.is_valid(from_hex('020105'), 'der') AS ok"
    success_criteria: "It is a well-formed INTEGER 5 in DER, so the answer is true."
  - name: "canonical_der_to_der"
    reference_sql: "SELECT lower(hex(asn1.main.to_der(from_hex('3080040248690000')))) AS der_hex"
    success_criteria: "Canonical DER of that OCTET STRING 'hi' is 300404024869."
  - name: "canonical_der_reencode"
    reference_sql: "SELECT lower(hex(asn1.main.reencode(from_hex('3080040248690000')))) AS der_hex"
    success_criteria: "The canonical minimal-length DER re-encoding is 300404024869."
  - name: "pem_block_label"
    reference_sql: "SELECT asn1.main.pem_label('-----BEGIN CERTIFICATE-----' || chr(10) || 'AQID' || chr(10) || '-----END CERTIFICATE-----') AS label"
    success_criteria: "The block label is 'CERTIFICATE'."
  - name: "snmp_community"
    reference_sql: "SELECT contains(asn1.main.snmp_decode(from_hex('302e02010104067075626c6963a2210201010201000201003016301406082b060102010101000408526f757465724f53')), '\"community\":\"public\"') AS ok"
    success_criteria: "The community is 'public', so the answer is true."
  - name: "snmp_varbind_oid"
    reference_sql: "SELECT oid FROM asn1.main.snmp_varbinds(from_hex('302e02010104067075626c6963a2210201010201000201003016301406082b060102010101000408526f757465724f53'))"
    success_criteria: "The lone varbind is sysDescr.0, OID 1.3.6.1.2.1.1.1.0."
  - name: "ldap_filter"
    reference_sql: "SELECT contains(asn1.main.ldap_decode(from_hex('3033020102632e040a64633d6578616d706c650a01020a0100020100020100010100a30b040375696404046a646f6530040402636e')), '(uid=jdoe)') AS ok"
    success_criteria: "The filter is (uid=jdoe), so the answer is true."
  - name: "ldap_operation"
    reference_sql: "SELECT op FROM asn1.main.ldap_messages(from_hex('3033020102632e040a64633d6578616d706c650a01020a0100020100020100010100a30b040375696404046a646f6530040402636e'))"
    success_criteria: "It is a SearchRequest."
  - name: "pem_decode_label"
    reference_sql: "SELECT label FROM asn1.main.pem_decode('-----BEGIN CERTIFICATE-----' || chr(10) || 'AQID' || chr(10) || '-----END CERTIFICATE-----')"
    success_criteria: "The single block is labelled 'CERTIFICATE'."
  - name: "krb_message_type"
    reference_sql: "SELECT contains(asn1.main.krb_decode(from_hex('61073005a003020105')), '\"msg_type\":\"Ticket\"') AS ok"
    success_criteria: "The [APPLICATION 1] tag identifies a Ticket, so the answer is true."
  - name: "krb_ticket_vno"
    reference_sql: "SELECT (asn1.main.krb_ticket(from_hex('61073005a003020105'))).tkt_vno AS vno"
    success_criteria: "The tkt-vno is 5."
  - name: "cms_content_type"
    reference_sql: "SELECT contains(asn1.main.cms_decode(from_hex('301106092a864886f70d010701a00404026869')), '\"content_type\":\"id-data\"') AS ok"
    success_criteria: "The content type OID 1.2.840.113549.1.7.1 is id-data, so ok is true."
  - name: "cms_signer_digest"
    reference_sql: "SELECT digest_alg FROM asn1.main.cms_signers(from_hex('304d0201013100301106092a864886f70d010701a00404026869a0053003020105312c302a020101800401020304300b0609608648016503040201300d06092a864886f70d01010105000403aabbcc'))"
    success_criteria: "The signer's digest algorithm is sha256."
  - name: "cms_cert_count"
    reference_sql: "SELECT len(asn1.main.cms_certs(from_hex('304d0201013100301106092a864886f70d010701a00404026869a0053003020105312c302a020101800401020304300b0609608648016503040201300d06092a864886f70d01010105000403aabbcc'))) AS n"
    success_criteria: "Exactly one certificate is embedded, so the answer is 1."
  - name: "cms_econtent_hex"
    reference_sql: "SELECT lower(hex(asn1.main.cms_content(from_hex('304d0201013100301106092a864886f70d010701a00404026869a0053003020105312c302a020101800401020304300b0609608648016503040201300d06092a864886f70d01010105000403aabbcc')))) AS hexval"
    success_criteria: "The eContent is the two bytes 'hi' = 6869."
  - name: "pkcs8_algorithm"
    reference_sql: "SELECT (asn1.main.pkcs8_info(from_hex('3016020100300d06092a864886f70d010101050004026869'))).algorithm AS algorithm"
    success_criteria: "The key algorithm is rsaEncryption."
  - name: "ocsp_status"
    reference_sql: "SELECT contains(asn1.main.ocsp_decode(from_hex('30030a0100')), '\"response_status\":\"successful\"') AS ok"
    success_criteria: "responseStatus 0 is 'successful', so ok is true."
  - name: "pkcs12_bag_type"
    reference_sql: "SELECT bag_type FROM asn1.main.pkcs12_bags(from_hex('3051020103304c06092a864886f70d010701a03f043d303b303906092a864886f70d010701a02c042a30283026060b2a864886f70d010c0a0103a0173015060a2a864886f70d01091601a00704053003020105'))"
    success_criteria: "The lone bag is a certBag."
  - name: "oid_registry_browse"
    reference_sql: "SELECT name FROM asn1.main.oid_registry WHERE oid = '1.2.840.113549.1.1.11'"
    success_criteria: "The registry maps that OID to 'sha256WithRSAEncryption'."
  - name: "pem_bundle_key_algorithm"
    reference_sql: "SELECT (asn1.main.pkcs8_info(p.der)).algorithm AS algorithm FROM asn1.main.pem_decode('-----BEGIN PKCS7-----' || chr(10) || 'ME0CAQExADARBgkqhkiG9w0BBwGgBAQCaGmgBTADAgEFMSwwKgIBAYAEAQIDBDALBglghkgBZQMEAgEwDQYJKoZIhvcNAQEBBQAEA6q7zA==' || chr(10) || '-----END PKCS7-----' || chr(10) || '-----BEGIN PRIVATE KEY-----' || chr(10) || 'MBYCAQAwDQYJKoZIhvcNAQEBBQAEAmhp' || chr(10) || '-----END PRIVATE KEY-----') AS p WHERE p.label = 'PRIVATE KEY'"
    success_criteria: "pem_decode splits the bundle; the PRIVATE KEY block is a PKCS#8 PrivateKeyInfo whose algorithm is rsaEncryption."
  - name: "keystore_certs_in_cms"
    reference_sql: "SELECT count(*) AS n FROM asn1.main.pkcs12_bags(from_hex('3079020103307406092a864886f70d010701a06704653063306106092a864886f70d010701a054045230503026060b2a864886f70d010c0a0103a0173015060a2a864886f70d01091601a007040530030201053026060b2a864886f70d010c0a0103a0173015060a2a864886f70d01091601a00704053003020106')) AS b WHERE b.cert_sha256 IN (SELECT sha256(unnest(asn1.main.cms_certs(from_hex('304d0201013100301106092a864886f70d010701a00404026869a0053003020105312c302a020101800401020304300b0609608648016503040201300d06092a864886f70d01010105000403aabbcc')))))"
    success_criteria: "The keystore has two certBags; only the one with cert_sha256 417c7763…d729 equals the SHA-256 of the certificate cms_certs extracts from the SignedData (the other, 4032…29d5, does not), so the answer is 1."
